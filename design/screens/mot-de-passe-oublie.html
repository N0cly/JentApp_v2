<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em; font-stretch: 85%">On t'envoie un lien</h1><p style="margin: 0; font-size: 15px; line-height: 22px; color: #A9B0B8">Entre l'email de ton compte. Tu recevras un lien pour choisir un nouveau mot de passe.</p><div style="display: flex; flex-direction: column; gap: 6px"><label for="email" style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Email</label><input id="email" type="email" value="nocly@exemple.fr" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px"></div><p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: #8A939E">Si un compte existe pour cet email, le lien arrive dans quelques minutes.</p><div style="flex-grow: 1"></div><a href="connexion.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border: 0; border-radius: 12px; background: #F2B632; color: #1A1304; font-size: 17px; font-weight: 700; flex-shrink: 0">Envoyer le lien</a>
