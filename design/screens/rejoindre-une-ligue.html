<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JentApp · Rejoindre une ligue</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050607;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0D1013; color: #EEF0EC; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px; flex-shrink: 0">
<a href="ligues.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 5l-7 7 7 7"/></svg></a>
<span style="font-size: 17px; line-height: 22px; font-weight: 700">Rejoindre une ligue</span>
</div>
<main style="flex-grow: 1; overflow: hidden; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em; font-stretch: 85%">Entre le code de la bande</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #A9B0B8">Six caractères, donnés par un membre. Avec un lien d'invitation, le code se remplit tout seul.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="code" style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Code d'invitation</label>
<input id="code" type="text" value="K7P2QX" maxlength="6" style="height: 64px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: #171B20; border: 1.5px solid #F2B632; color: #EEF0EC; font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-align: center">
</div>
<div style="background: #F3F1E7; color: #14181C; border-radius: 6px; position: relative; flex-shrink: 0">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 11px; line-height: 16px; letter-spacing: 0.08em; color: #4D5660"><span>INVITATION</span><span>CODE K7P2QX</span></div>
<div style="font-size: 24px; line-height: 28px; font-weight: 800; letter-spacing: -0.01em; font-stretch: 85%; margin-bottom: 4px">Coloc</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 14px; line-height: 20px"><span style="color: #4D5660">Membres</span><span>4</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 14px; line-height: 20px"><span style="color: #4D5660">Invité par</span><span>Paco_Le_Fou</span></div>
</div>
<div style="position: relative; height: 16px"><div style="position: absolute; left: 14px; right: 14px; top: 7px; border-top: 1.5px dashed #4D5660"></div><span style="position: absolute; top: 0; left: -8px; width: 16px; height: 16px; border-radius: 999px; background: #0D1013"></span><span style="position: absolute; top: 0; right: -8px; width: 16px; height: 16px; border-radius: 999px; background: #0D1013"></span></div>
<div style="padding: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 14px; line-height: 20px"><span style="color: #4D5660">Dotation de départ</span><span style="font-size: 20px; line-height: 24px">50 clopes</span></div>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<a href="paris.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; background: #F2B632; color: #1A1304; font-size: 17px; font-weight: 700">Rejoindre Coloc</a>
<button type="button" style="min-height: 52px; border-radius: 12px; background: #0D1013; border: 1px solid #66717E; font-size: 15px; font-weight: 700">Créer ma propre ligue</button>
</div>
</main>
</div>
</body>
</html>
