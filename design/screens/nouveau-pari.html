<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JentApp · Nouveau pari</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050607;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0D1013; color: #EEF0EC; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px; flex-shrink: 0">
<a href="paris.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 5l-7 7 7 7"/></svg></a>
<span style="font-size: 17px; line-height: 22px; font-weight: 700">Nouveau pari</span>
</div>
<main style="flex-grow: 1; overflow: hidden; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="question" style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Question</label>
<input id="question" type="text" value="Qui paie la première tournée ?" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px; font-weight: 600">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Options, de 2 à 8</span>
<div style="display: flex; align-items: center; gap: 8px"><label for="opt1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Option 1</label><input id="opt1" type="text" value="Paco_Le_Fou" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px"><button type="button" aria-label="Retirer l'option 1" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: #0D1013; color: #8A939E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div style="display: flex; align-items: center; gap: 8px"><label for="opt2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Option 2</label><input id="opt2" type="text" value="Mister_Clope" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px"><button type="button" aria-label="Retirer l'option 2" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: #0D1013; color: #8A939E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div style="display: flex; align-items: center; gap: 8px"><label for="opt3" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Option 3</label><input id="opt3" type="text" value="La_Dèche" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px"><button type="button" aria-label="Retirer l'option 3" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: #0D1013; color: #8A939E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; background: #0D1013; border: 1.5px dashed #66717E; color: #A9B0B8; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 5v14M5 12h14"/></svg>Ajouter une option</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Moment</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #0D1013; color: #A9B0B8; border: 1px solid #66717E">Before</button><button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #EEF0EC; color: #14181C; border: 1px solid #EEF0EC">Night</button><button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #0D1013; color: #A9B0B8; border: 1px solid #66717E">After</button><button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #0D1013; color: #A9B0B8; border: 1px solid #66717E">Daily</button><button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #0D1013; color: #A9B0B8; border: 1px solid #66717E">Spécial</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Ouverture</span><button type="button" style="display: flex; align-items: center; justify-content: space-between; text-align: left; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px">Maintenant<span style="color: #8A939E; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 9l7 7 7-7"/></svg></span></button></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A9B0B8">Fermeture</span><button type="button" style="display: flex; align-items: center; justify-content: space-between; text-align: left; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #171B20; border: 1px solid #66717E; color: #EEF0EC; font: inherit; font-size: 15px">Ce soir, 23:30<span style="color: #8A939E; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 9l7 7 7-7"/></svg></span></button></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Pari mystère</span><span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #8A939E">Question cachée jusqu'à l'ouverture</span></span>
<button type="button" aria-pressed="false" aria-label="Pari mystère" style="width: 52px; height: 32px; padding: 3px; border-radius: 999px; background: #20262D; border: 1px solid #66717E; display: flex; align-items: center; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 999px; background: #A9B0B8"></span></button>
</div>
<div style="flex-grow: 1"></div>
<a href="paris.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; background: #F2B632; color: #1A1304; font-size: 17px; font-weight: 700; flex-shrink: 0">Publier le pari</a>
</main>
</div>
</body>
</html>
