name: CI

# develop alimente la validation, main la production (docs/VALIDATION.md, A.0).
# L'image n'est construite que sur develop ; main ne fait qu'étiqueter `latest`
# l'image déjà construite pour le même commit.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jentapp
          POSTGRES_PASSWORD: jentapp
          POSTGRES_DB: jentapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jentapp -d jentapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jentapp:jentapp@localhost:5432/jentapp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # docs/AUTOMATISATION.md, A.5 : la validation suit develop, sans geste sur le
  # VPS. La clé ne peut lancer que ci-deploy.sh, qui ne lit que l'étiquette.
  deploy-validation:
    name: Deploy to validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: image
    runs-on: ubuntu-latest
    environment: validation
    timeout-minutes: 10
    # Un seul déploiement à la fois ; les suivants attendent leur tour.
    concurrency:
      group: deploy-validation
      cancel-in-progress: false
      queue: max
    permissions: {}
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VALIDATION_SSH_KEY }}
          SSH_HOST: ${{ secrets.VALIDATION_SSH_HOST }}
          SSH_PORT: ${{ secrets.VALIDATION_SSH_PORT }}
          SSH_USER: ${{ secrets.VALIDATION_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VALIDATION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/validation_deploy
          chmod 600 ~/.ssh/validation_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/validation_known_hosts
          ssh -i ~/.ssh/validation_deploy -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/validation_known_hosts" \
            "$SSH_USER@$SSH_HOST" "sha-${GITHUB_SHA:0:7}"

  latest:
    name: Tag the validated image as latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rien n'est reconstruit : l'image de ce commit, publiée par develop, reçoit
      # l'étiquette `latest`. Sans elle, le commit n'est pas passé par develop et
      # ne se déploie pas. Testé par scripts/ci.test.ts.
      - id: tag-latest
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="sha-${GITHUB_SHA:0:7}"
          if ! docker buildx imagetools inspect "$image:$tag" >/dev/null 2>&1; then
            echo "::error::$image:$tag n'existe pas : ce commit n'est pas passé par develop. Le reporter sur develop, attendre sa CI, puis refaire git merge --ff-only develop."
            exit 1
          fi
          docker buildx imagetools create --tag "$image:latest" "$image:$tag"
          echo "$image:$tag étiquetée latest"

  # docs/AUTOMATISATION.md, A.6 : un push sur develop ou main dont un job
  # échoue prévient sur Telegram. Jamais sur une demande de fusion.
  notify-failure:
    name: Report CI failure on Telegram
    if: failure() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [check, image, deploy-validation, latest]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Testé par scripts/ci.test.ts. Le jeton passe par l'entrée standard de curl.
      - id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="${COMMIT_MESSAGE%%$'\n'*}"
          text="CI ÉCHEC · $BRANCH · ${GITHUB_SHA:0:7} · $title · $RUN_URL"
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$TELEGRAM_BOT_TOKEN" \
            | curl -sS --fail-with-body --max-time 15 --config - \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$text" >/dev/null
