# Environnement local : app + Postgres.
# La production utilise deploy/docker-compose.yml.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 range ses données sous /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    ports:
      # Pour `pnpm dev` et les tests d'intégration lancés depuis la machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
