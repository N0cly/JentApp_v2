# Environnement local : app + Postgres.
# La production utilise deploy/docker-compose.yml.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      # L'app n'écoute que sur la machine : Nginx fait l'entrée publique.
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      # SMTP pour `pnpm dev`, interface web sur http://localhost:8025.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 range ses données sous /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    ports:
      # Pour `pnpm dev` et les tests d'intégration lancés depuis la machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
