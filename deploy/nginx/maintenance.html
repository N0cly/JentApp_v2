<!doctype html>
<!--
  Page de maintenance (docs/ANNONCE.md), servie par Nginx quand l'app ne répond
  pas : 502, 503, 504, pendant qu'un déploiement redémarre le conteneur.
  Autonome : rien n'est chargé depuis l'app, qui est justement arrêtée.
  Installée dans /var/www/jentapp/ (docs/DEPLOY.md). Couleurs, typo, espacements
  et rayons : valeurs de design/tokens.json, mise en page de la page hors ligne.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1013" />
    <meta name="robots" content="noindex" />
    <title>JentApp</title>
    <style>
      :root {
        --bg: #0d1013;
        --ink: #eef0ec;
        --ink-muted: #a9b0b8;
        --line-strong: #66717e;
        --paper: #f3f1e7;
        --on-paper: #14181c;
        --on-paper-muted: #4d5660;
        --brand: #f2b632;
        --font-display: "Bricolage Grotesque", system-ui, sans-serif;
        --space-2: 8px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-md: 12px;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }
      body {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-6);
        padding: var(--space-5) var(--space-5) var(--space-8);
        color: var(--ink);
        font-family: var(--font-display);
        text-align: center;
        overflow-wrap: anywhere;
      }
      svg {
        flex-shrink: 0;
        border-radius: var(--radius-md);
      }
      .texts {
        display: flex;
        max-width: 390px;
        flex-direction: column;
        gap: var(--space-2);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 24px;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--ink-muted);
        font-size: 15px;
        line-height: 22px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <svg width="64" height="64" viewBox="0 0 512 512" role="img" aria-label="Icône de JentApp">
      <rect width="512" height="512" fill="var(--bg)" />
      <rect
        x="1"
        y="1"
        width="510"
        height="510"
        rx="112"
        fill="var(--bg)"
        stroke="var(--line-strong)"
        stroke-width="6"
      />
      <g transform="rotate(-8 256 256) translate(256 256) scale(1.1) translate(-110 -150)">
        <rect width="220" height="300" rx="14" fill="var(--paper)" />
        <circle cx="0" cy="200" r="18" fill="var(--bg)" />
        <circle cx="220" cy="200" r="18" fill="var(--bg)" />
        <line
          x1="32"
          y1="200"
          x2="188"
          y2="200"
          stroke="var(--on-paper-muted)"
          stroke-width="5"
          stroke-dasharray="12 10"
        />
        <path
          d="M154 36V118A44 44 0 0 1 71.9 140"
          fill="none"
          stroke="var(--on-paper)"
          stroke-width="34"
        />
        <rect x="40" y="236" width="140" height="28" rx="14" fill="var(--brand)" />
      </g>
    </svg>
    <div class="texts">
      <h1>JentApp revient dans un instant.</h1>
      <p>Mise à jour en cours. Recharge la page dans une minute.</p>
    </div>
  </body>
</html>
