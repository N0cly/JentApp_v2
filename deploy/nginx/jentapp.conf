# /etc/nginx/sites-available/jentapp.conf — voir docs/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name jentapp.nocly.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jentapp.nocly.fr;

    ssl_certificate /etc/letsencrypt/live/jentapp.nocly.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jentapp.nocly.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Photo de profil et image de cosmétique : 5 Mo, plus l'enveloppe du formulaire.
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # L'app ne répond pas (un déploiement redémarre le conteneur) : page de
    # maintenance, avec le code d'erreur. Les 5xx renvoyés par l'app elle-même
    # passent tels quels (pas de proxy_intercept_errors).
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/jentapp;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Flux temps réel (SSE, à partir de M4) : pas de tampon, connexions longues.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Service worker : toujours revalidé, pour qu'une nouvelle version s'installe.
    # Un add_header ici annule ceux du bloc server : ils sont répétés.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        proxy_hide_header Cache-Control;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
