# /etc/nginx/sites-available/jentapp.conf — voir docs/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name jentapp.nocly.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jentapp.nocly.fr;

    ssl_certificate /etc/letsencrypt/live/jentapp.nocly.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jentapp.nocly.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Flux temps réel (SSE, à partir de M4) : pas de tampon, connexions longues.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
