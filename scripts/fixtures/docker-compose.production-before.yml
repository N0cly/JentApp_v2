# Production, sur le VPS. Voir docs/DEPLOY.md.
name: jentapp

# Journaux Docker : 10 Mo par fichier, 5 fichiers gardés, pour chaque service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ghcr.io/n0cly/jentapp_v2:${JENTAPP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Valeurs dans /opt/jentapp/.env (modèle : deploy/.env.example). Le délai de
    # versement n'est pas transmis : il reste à 10 minutes en production.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      UPLOADS_DIR: /app/uploads
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Suivi d'erreurs (GlitchTip) : vide, désactivé.
      ERROR_DSN: ${ERROR_DSN:-}
    ports:
      # Seul Nginx, sur la même machine, parle à l'app.
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
